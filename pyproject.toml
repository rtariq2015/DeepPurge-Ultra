[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-purge-ultra"
version = "0.2.0"
description = "A native GTK3 Linux application uninstaller with explicit recoverable cleanup"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
