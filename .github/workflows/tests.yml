name: Verify GTK application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb dbus-x11 desktop-file-utils
      - name: Check Python and desktop launcher
        run: |
          /usr/bin/python3 -m compileall -q src tests
          desktop-file-validate assets/deep-purge-ultra.desktop
          git diff --check
      - name: Run unit and GTK tests
        run: dbus-run-session -- xvfb-run -a env DEEPPURGE_UI_TESTS=1 GDK_BACKEND=x11 /usr/bin/python3 tests/run.py
